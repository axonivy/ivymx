name: Publish Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release draft tag to publish (e.g. v3.0.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release draft tag to publish (e.g. v3.0.0)
        type: string
        required: true

jobs:
  publish_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Find release draft
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const release = releases.find(release => release.tag_name === tag);
            if (!release) {
              throw new Error(`No release draft found for ${tag}.`);
            }
            if (!release.draft) {
              throw new Error(`${tag} is already published.`);
            }
            const target = release.target_commitish.replace(/^refs\/heads\//, '');
            core.setOutput('commitish', target);

      - name: Publish release draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          commitish: ${{ steps.draft.outputs.commitish }}
          name: ${{ inputs.tag }}
          tag: ${{ inputs.tag }}
          publish: true
          latest: legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
